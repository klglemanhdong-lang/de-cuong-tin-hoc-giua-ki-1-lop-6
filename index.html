<script>
'use strict';
const MC_QUESTIONS = [
 {n:1,text:'Trong hoạt động xử lý thông tin, thao tác con người đọc sách, quan sát bản đồ hay nghe giảng thuộc về quá trình nào?',options:[['a','Thu nhận thông tin.'],['b','Xử lý thông tin.'],['c','Lưu trữ thông tin.'],['d','Truyền thông tin.']],answer:'a',why:'Đọc sách, quan sát bản đồ và nghe giảng là cách con người tiếp nhận thông tin từ môi trường.'},
 {n:2,text:'Vật mang tin là gì?',options:[['a','Là thiết bị duy nhất chứa các dữ liệu dạng số.'],['b','Là vật thể, phương tiện mang lại cho con người thông tin.'],['c','Mọi thiết bị điện tử có kết nối Internet.'],['d','Các phần mềm máy tính dùng để xử lý dữ liệu.']],answer:'b',why:'Vật mang tin là vật thể hoặc phương tiện chứa đựng, truyền tải thông tin; không chỉ giới hạn ở thiết bị số.'},
 {n:3,text:'Nhờ đâu mà máy tính có thể xử lý, lưu trữ và truyền thông tin một cách chính xác và nhanh chóng?',options:[['a','Dữ liệu được biểu diễn dưới dạng các kí tự tiếng Anh.'],['b','Dữ liệu đã được chuyển thành dạng dãy bit chỉ gồm hai kí hiệu 0 và 1.'],['c','Dữ liệu được ghi dưới dạng các hình ảnh màu sắc.'],['d','Máy tính tự động đọc được ngôn ngữ tự nhiên của con người.']],answer:'b',why:'Máy tính số biểu diễn dữ liệu bằng các bit, mỗi bit nhận một trong hai giá trị 0 hoặc 1.'},
 {n:4,text:'Một bit trong máy tính nhận một trong hai trạng thái nào sau đây?',options:[['a','Đúng hoặc Sai.'],['b','0 hoặc 1.'],['c','Bật hoặc Tắt.'],['d','Có hoặc Không.']],answer:'b',why:'Bit là đơn vị thông tin nhỏ nhất và có thể nhận giá trị 0 hoặc 1.'},
 {n:5,text:'Thiết bị nào sau đây là thiết bị ra của máy tính?',options:[['a','Bàn phím (Keyboard).'],['b','Máy quét (Scanner).'],['c','Màn hình (Monitor).'],['d','Chuột máy tính (Mouse).']],answer:'c',why:'Màn hình đưa kết quả xử lý của máy tính ra cho người dùng quan sát.'},
 {n:6,text:'Thao tác nào sau đây thể hiện việc sử dụng máy tính an toàn, đúng cách?',options:[['a','Tắt máy bằng cách ngắt nguồn điện trực tiếp.'],['b','Vừa ăn uống vừa làm việc bên bàn máy tính.'],['c','Sử dụng nút lệnh Shut down để tắt máy tính.'],['d','Dùng tay ướt để cắm/rút phích cắm điện.']],answer:'c',why:'Dùng lệnh Shut down giúp tắt máy theo đúng quy trình; không nên ngắt điện đột ngột hoặc thao tác điện khi tay ướt.'},
 {n:7,text:'Khi truy cập Internet, hành vi nào sau đây là an toàn và tuân thủ quy tắc ứng xử?',options:[['a','Chia sẻ ngay thông tin chưa được kiểm chứng lên mạng xã hội.'],['b','Không mở các tệp đính kèm từ email gửi bởi người lạ.'],['c','Đặt mật khẩu tài khoản là các dãy số đơn giản như 123456.'],['d','Nhấp vào các đường liên kết lạ có nội dung quảng cáo trúng thưởng.']],answer:'b',why:'Tệp đính kèm từ người lạ có thể chứa nội dung độc hại. Không mở tệp đáng ngờ và cần xác minh trước khi tin hoặc chia sẻ.'},
 {n:8,text:'Tác hại lớn nhất của việc sử dụng Internet quá nhiều, nghiện game trực tuyến đối với học sinh là gì?',options:[['a','Tăng khả năng tư duy và phản xạ nhanh.'],['b','Giúp kết bạn được với nhiều người trên toàn thế giới.'],['c','Ảnh hưởng xấu đến sức khỏe, thị lực và sa sút kết quả học tập.'],['d','Giúp máy tính chạy nhanh hơn.']],answer:'c',why:'Sử dụng quá mức có thể ảnh hưởng sức khỏe, thị lực, thời gian học tập và kết quả học tập.'},
 {n:9,text:'Đơn vị đo dung lượng thông tin nhỏ nhất trong máy tính là gì?',options:[['a','Byte.'],['b','Bit.'],['c','Kilobyte.'],['d','Gigabyte.']],answer:'b',why:'Bit là đơn vị thông tin nhỏ nhất; byte và các đơn vị KB, GB biểu thị lượng thông tin lớn hơn.'},
 {n:10,text:'Khi đọc dòng chữ “Đảo Cò, xuồng máy, 40.000đ, 35 phút” được viết trên tấm bảng gỗ tại bến tàu, đâu là vật mang tin?',options:[['a','Giá vé 40.000 đồng.'],['b','Xuồng máy di chuyển.'],['c','Thời gian đi 35 phút.'],['d','Tấm bảng gỗ.']],answer:'d',why:'Tấm bảng gỗ là vật mang tin; chữ trên bảng chứa thông tin về địa điểm, giá vé và thời gian.'},
 {n:11,text:'Thành phần nào sau đây được ví như “bộ não” của máy tính, có chức năng thực hiện các lệnh và điều khiển mọi hoạt động xử lý thông tin của máy tính?',options:[['a','Màn hình.'],['b','Bộ xử lý trung tâm.'],['c','Bàn phím.'],['d','Chuột máy tính.']],answer:'b',why:'Bộ xử lý trung tâm (CPU) thực hiện lệnh và điều khiển hoạt động xử lý của máy tính.'},
 {n:12,text:'Để thay đổi kiểu chữ (như in đậm, in nghiêng, gạch chân) hoặc màu chữ cho một đoạn văn bản trong phần mềm soạn thảo, trước tiên em cần thực hiện thao tác nào?',options:[['a','Nhấn phím Enter trên bàn phím.'],['b','Lưu văn bản vào ổ đĩa.'],['c','Chọn (bôi đen) phần văn bản cần định dạng.'],['d','Nháy chuột vào nút lệnh Print.']],answer:'c',why:'Cần chọn phần văn bản muốn định dạng trước khi áp dụng kiểu hoặc màu chữ.'},
 {n:13,text:'Thiết bị nào sau đây của máy tính thực hiện chức năng xử lí thông tin?',options:[['a','Màn hình.'],['b','Bộ xử lí (CPU).'],['c','Bàn phím.'],['d','Chuột.']],answer:'b',why:'CPU thực hiện việc xử lý dữ liệu theo các lệnh của chương trình.'},
 {n:14,text:'Bố bạn An đọc tờ báo buổi sáng thấy dự báo thời tiết chiều nay có mưa to kèm dông sét, vì vậy bố dặn An chuẩn bị áo mưa trước khi đi học. Ví dụ trên thể hiện rõ nhất điều gì?',options:[['a','Mọi thông tin đều được lưu vào USB.'],['b','Dữ liệu chỉ có thể biểu diễn bằng hình ảnh.'],['c','Thông tin trên báo chí luôn luôn chính xác tuyệt đối.'],['d','Thông tin có khả năng làm thay đổi nhận thức và hành động của con người.']],answer:'d',why:'Thông tin dự báo khiến bố An thay đổi quyết định và dặn An chuẩn bị áo mưa.'},
 {n:15,text:'Tại sao trong máy tính, mọi dạng thông tin (văn bản, hình ảnh, âm thanh) đều phải chuyển đổi thành dãy các kí hiệu 0 và 1?',options:[['a','Vì máy tính thích các con số nhỏ.'],['b','Vì máy tính thông dụng hiện nay chỉ trực tiếp nhận biết, lưu trữ và xử lí hai trạng thái tương ứng với 0 và 1 (dãy bit).'],['c','Vì việc biểu diễn bằng 0 và 1 sẽ làm hình ảnh hiển thị đẹp hơn.'],['d','Vì bàn phím máy tính chỉ có hai phím số 0 và 1.']],answer:'b',why:'Máy tính số biểu diễn và xử lý thông tin thông qua hai trạng thái được quy ước là 0 và 1.'},
 {n:16,text:'Lợi ích nổi bật nhất của việc sử dụng sơ đồ tư duy so với cách ghi chép dạng văn bản thông thường là gì?',options:[['a','Giúp lưu trữ được các tệp video dung lượng cực lớn.'],['b','Tự động sửa tất cả các lỗi chính tả trong văn bản.'],['c','Giúp người xem nhìn thấy bức tranh tổng thể, dễ dàng ghi nhớ và kích thích khả năng sáng tạo.'],['d','Giúp máy tính khởi động nhanh hơn.']],answer:'c',why:'Sơ đồ tư duy thể hiện kiến thức trực quan, làm rõ mối liên hệ giữa các ý và hỗ trợ ghi nhớ, sáng tạo.'},
 {n:17,text:'Khi thiết kế sơ đồ tư duy bằng phần mềm như MindMaple Lite, việc sử dụng các màu sắc khác nhau cho từng nhánh có tác dụng gì?',options:[['a','Làm dung lượng tệp lưu trữ nhẹ hơn.'],['b','Kích thích não bộ, phân biệt rõ các cụm nội dung và tăng khả năng tiếp thu trực quan.'],['c','Giúp máy in không bị lỗi khi in ra giấy.'],['d','Để phần mềm chạy mà không cần bộ nhớ máy tính.']],answer:'b',why:'Màu sắc giúp phân biệt nhánh và nhóm thông tin, tạo sự rõ ràng khi quan sát sơ đồ.'},
 {n:18,text:'Bạn Nam muốn tạo một thư mục mới có tên là “HocTap” nằm ngay trên màn hình nền (Desktop) để lưu trữ các bài tập môn Tin học. Thao tác chuột nào sau đây là đúng để bắt đầu tạo thư mục mới trên màn hình nền?',options:[['a','Nháy đúp chuột trái vào khoảng trống trên màn hình nền → chọn Delete.'],['b','Nháy chuột trái vào một biểu tượng bất kỳ trên màn hình nền → chọn Rename.'],['c','Nháy chuột phải vào khoảng trống trên màn hình nền → chọn New → chọn Folder.'],['d','Nhấn phím Enter trên bàn phím → chọn Properties.']],answer:'c',why:'Trên vùng trống của Desktop, nháy chuột phải rồi chọn New → Folder để tạo thư mục mới.'},
 {n:19,text:'Trong phòng máy tính của trường, khi học sinh muốn đưa dữ liệu (ví dụ: các bức ảnh chụp hoặc tệp văn bản) từ máy tính cá nhân hoặc máy quét vào bên trong máy tính để xử lý, thiết bị nào sau đây được sử dụng?',options:[['a','Màn hình (Monitor) và máy in (Printer).'],['b','Loa (Speaker) và tai nghe (Headphone).'],['c','Bàn phím (Keyboard), chuột (Mouse) và máy quét (Scanner).'],['d','Máy chiếu (Projector).']],answer:'c',why:'Trong các lựa chọn của đề cương, bàn phím, chuột và máy quét là nhóm thiết bị nhập thông tin vào máy tính.'},
 {n:20,text:'Khi thiết kế sơ đồ tư duy trên phần mềm để chuẩn bị cho một chuyến tham quan ngoại khóa, bạn Mai tạo chủ đề chính là “Chuyến dã ngoại”, sau đó muốn thêm một chủ đề nhánh con là “Địa điểm”, Mai cần thực hiện lệnh nào?',options:[['a','Chọn ô chủ đề chính rồi chọn lệnh chèn Subtopic (nhánh con).'],['b','Nhấn phím Delete trên bàn phím.'],['c','Chọn thẻ File → Save as.'],['d','Chọn Insert Table.']],answer:'a',why:'Lệnh Subtopic dùng để thêm một chủ đề nhánh con cho chủ đề đang được chọn.'}
];

 {n:21,stem:'Xét các phát biểu về quy trình xử lí thông tin và biểu diễn dữ liệu trong máy tính:',items:[
  {id:'21a',label:'a',text:'Quá trình xử lí thông tin của con người và máy tính gồm 4 bước cơ bản: Thu nhận, lưu trữ, xử lí và truyền thông tin.',answer:true,why:'Theo phát biểu trong đề cương, bốn quá trình được nêu là thu nhận, lưu trữ, xử lý và truyền thông tin.'},
  {id:'21b',label:'b',text:'1 KB (Kilobyte) xấp xỉ bằng 1 tỉ byte theo hệ đo lường thông dụng.',answer:false,why:'1 KB xấp xỉ 1 nghìn byte; 1 GB mới xấp xỉ 1 tỉ byte theo hệ thập phân.'},
  {id:'21c',label:'c',text:'Các con số, chữ cái, hình ảnh, âm thanh khi đưa vào máy tính đều được chuyển đổi thành dãy bit chỉ gồm hai kí tự 0 và 1.',answer:true,why:'Các dạng dữ liệu số được mã hóa để lưu trữ và xử lý dưới dạng dãy bit 0 và 1.'},

 {n:22,stem:'Khi xây dựng một sơ đồ tư duy phục vụ việc tóm tắt kiến thức bài học môn Tin học:',items:[
  {id:'22a',label:'a',text:'Chủ đề chính của sơ đồ tư duy thường được đặt ở trung tâm (giữa) của sơ đồ.',answer:true,why:'Chủ đề chính thường được đặt ở trung tâm để phát triển các nhánh.'},
  {id:'22b',label:'b',text:'Trên sơ đồ tư duy, chỉ có thể viết văn bản dài dòng chứ không thể chèn thêm hình ảnh minh họa.',answer:false,why:'Sơ đồ tư duy có thể sử dụng từ khóa ngắn gọn và hình ảnh minh họa.'},

  {id:'22d',label:'d',text:'Khi cần tóm tắt một bài học nhiều đề mục lớn nhỏ, việc trình bày dưới dạng sơ đồ tư duy phân nhánh sẽ giúp dễ ghi nhớ và ôn tập nhanh hơn dạng đoạn văn thông thường.',answer:true,why:'Sơ đồ phân nhánh giúp nhìn thấy bức tranh tổng thể và xem lại các ý chính nhanh hơn.'}
 ]},
 {n:23,stem:'Khi tìm hiểu về cấu trúc và cách tạo sơ đồ tư duy trong học tập, các phát biểu sau đây là đúng hay sai?',items:[
  {id:'23a',label:'a',text:'Chủ đề chính của sơ đồ tư duy thường được đặt ở trung tâm (giữa) của sơ đồ.',answer:true,why:'Chủ đề trung tâm là điểm xuất phát để phát triển các nhánh.'},
  {id:'23b',label:'b',text:'Sơ đồ tư duy chỉ có thể vẽ trên giấy thủ công chứ không thể sử dụng các phần mềm máy tính để tạo ra.',answer:false,why:'Có thể tạo sơ đồ tư duy cả trên giấy và bằng phần mềm máy tính.'},

 ]},
 {n:24,stem:'Xét các phát biểu về cấu trúc, cách tạo và vai trò của sơ đồ tư duy trong học tập:',items:[
  {id:'24a',label:'a',text:'Chủ đề chính của sơ đồ tư duy thường được đặt ở vị trí trung tâm để làm gốc phát triển các ý tưởng.',answer:true,why:'Chủ đề trung tâm làm gốc cho các nhánh ý tưởng.'},
  {id:'24b',label:'b',text:'Mỗi chủ đề nhánh trong sơ đồ tư duy chỉ được phép viết bằng một đoạn văn bản dài dòng, chi tiết mà không được dùng từ khóa ngắn gọn.',answer:false,why:'Sơ đồ tư duy ưu tiên từ khóa ngắn gọn; có thể kèm hình ảnh và nhánh con.'},
  {id:'24c',label:'c',text:'Sơ đồ tư duy giúp người học nhìn thấy bức tranh tổng thể, dễ dàng ghi nhớ và kích thích khả năng sáng tạo.',answer:true,why:'Đây là các lợi ích được nêu trong phần đáp án tham khảo của đề cương.'},

 ]},
 {n:25,stem:'Xét các tình huống về thông tin, dữ liệu và thiết bị lưu trữ thông tin:',items:[

  {id:'25d',label:'d',text:'Một thẻ nhớ có dung lượng 16 GB có thể lưu trữ được khoảng hơn 1.000 bức ảnh, mỗi bức ảnh có dung lượng xấp xỉ 12 MB (biết 1 GB = 1024 MB).',answer:true,why:'16 GB = 16.384 MB; 16.384 chia 12 xấp xỉ 1.365 ảnh, tức là hơn 1.000 ảnh (chưa tính dung lượng sử dụng khác).'}
 ]}

function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function normalizeText(value){return String(value??'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function hasAny(text,terms){const s=normalizeText(text);return terms.some(term=>{const t=normalizeText(term);if(!t)return false;return (' '+s+' ').includes(' '+t+' ');});}
function groupMatches(text,groups){return (groups||[]).every(group=>hasAny(text,group));}
function unitOrderMatches(text){
 const s=normalizeText(text);
 const aliases=[['kilobyte','kb'],['megabyte','mb'],['gigabyte','gb'],['terabyte','tb']];
 let last=-1;
 for(const group of aliases){let best=-1;for(const term of group){const pos=s.indexOf(normalizeText(term));if(pos>=0&&(best<0||pos<best))best=pos;}if(best<0||best<=last)return false;last=best;}
 return true;
}
function unitValueMatches(text,unitTerms,valueTerms){
 const parts=String(text??'').split(/[;\n.!?,]+/).map(normalizeText).filter(Boolean);
 return parts.some(part=>hasAny(part,unitTerms)&&hasAny(part,valueTerms));
}
function customCriterionMatches(text,custom){
 const rules={
  kbValue:{unit:['kb','kilobyte'],good:['nghin','mot nghin','1000','1 000'],bad:['trieu','ti','ty']},
  mbValue:{unit:['mb','megabyte'],good:['trieu','mot trieu','1000000','1 000 000'],bad:['nghin ti','nghin ty','ti','ty']},
  gbValue:{unit:['gb','gigabyte'],good:['ti','ty','mot ti','mot ty','1000000000','1 000 000 000'],bad:['nghin ti','nghin ty']},
  tbValue:{unit:['tb','terabyte'],good:['nghin ti','nghin ty','mot nghin ti','mot nghin ty','1000000000000','1 000 000 000 000'],bad:[]}
 };
 const rule=rules[custom];if(!rule)return false;
 const parts=String(text??'').split(/[;\n.!?,]+/).map(normalizeText).filter(Boolean);
 return parts.some(part=>hasAny(part,rule.unit)&&hasAny(part,rule.good)&&!hasAny(part,rule.bad));
}
function shuffle(array){const result=array.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function shuffleQuestion(q){return {...q,options:shuffle(q.options.map(o=>({id:'q'+q.n+'_'+o[0],originalLabel:o[0].toUpperCase(),text:o[1],correct:o[0]===q.answer}))) };}
function getHistory(){try{const raw=localStorage.getItem(APP_KEY);const parsed=raw?JSON.parse(raw):[];return Array.isArray(parsed)?parsed:[];}catch(e){return [];}}
function saveHistory(history){try{localStorage.setItem(APP_KEY,JSON.stringify(history.slice(0,MAX_HISTORY)));return true;}catch(e){showToast('Không lưu được lịch sử. Hãy kiểm tra dung lượng trình duyệt.');return false;}}
function formatDate(dateString){const d=new Date(dateString);if(Number.isNaN(d.getTime()))return 'Không rõ thời gian';return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);}
function formatDuration(seconds){const n=Math.max(0,Math.floor(seconds||0));const m=Math.floor(n/60),s=n%60;return m+' phút '+String(s).padStart(2,'0')+' giây';}
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.add('hidden'),2600);}
function playSound(kind='tap'){
 if(!soundEnabled)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const ctx=new Ctx();const now=ctx.currentTime;
  const tones=kind==='submit'?[[523.25,0],[659.25,.12],[783.99,.24]]:kind==='navigate'?[[510,0]]:[[620,0]];
  tones.forEach(([freq,offset])=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(kind==='submit'?.11:.055,now+offset+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.13);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+offset);osc.stop(now+offset+.14);});
  setTimeout(()=>ctx.close().catch(()=>{}),700);
 }catch(e){}
}

function makeSteps(){const steps=[];MC_QUESTIONS.forEach((q,i)=>steps.push({type:'mc',index:i,title:'Câu '+q.n,section:'Trắc nghiệm A–D'}));TF_QUESTIONS.forEach((q,i)=>steps.push({type:'tf',index:i,title:'Câu '+q.n,section:'Đúng / Sai'}));ESSAYS.forEach((q,i)=>steps.push({type:'essay',index:i,title:'Câu '+q.n,section:'Tự luận'}));return steps;}
function startAttempt(name){
 attempt={player:name.trim(),startedAt:new Date().toISOString(),startMs:Date.now(),shuffledMC:MC_QUESTIONS.map(shuffleQuestion),answersMC:{},answersTF:{},answersEssay:{},currentStep:0};

function elapsed(){return attempt?Math.floor((Date.now()-attempt.startMs)/1000):0;}
function updateTimer(){const node=document.getElementById('liveTimer');if(node&&attempt&&screen==='quiz')node.textContent=formatDuration(elapsed());}
function answerCount(a){if(!a)return 0;let n=0;for(const q of a.shuffledMC)if(a.answersMC[q.n])n++;for(const q of TF_QUESTIONS)for(const item of q.items)if(typeof a.answersTF[item.id]==='boolean')n++;for(const q of ESSAYS)if(String(a.answersEssay[q.n]||'').trim())n++;return n;}
function unansweredCount(a){return 44-answerCount(a);}
function currentStepData(){const steps=makeSteps();return steps[attempt.currentStep]||steps[0];}
function isStepAnswered(step){if(step.type==='mc')return !!attempt.answersMC[MC_QUESTIONS[step.index].n];if(step.type==='tf')return TF_QUESTIONS[step.index].items.every(item=>typeof attempt.answersTF[item.id]==='boolean');return !!String(attempt.answersEssay[ESSAYS[step.index].n]||'').trim();}

function renderMC(step){const q=attempt.shuffledMC[step.index];const selected=attempt.answersMC[q.n];return `<section class="card question-card"><div class="question-meta"><span class="question-number">CÂU ${q.n} / 20</span><span class="points">2 điểm</span></div><h2 class="question-text">${escapeHtml(q.text)}</h2><div class="option-list">${q.options.map((o,i)=>`<button class="option-btn ${selected===o.id?'selected':''}" data-action="chooseMC" data-option="${o.id}" aria-pressed="${selected===o.id}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="option-text">${escapeHtml(o.text)}</span></button>`).join('')}</div><div class="keyword-preview">💡 Chọn một đáp án phù hợp nhất. Đáp án và lời giải sẽ hiện sau khi bạn nộp bài.</div></section>`;}
function renderTF(step){const q=TF_QUESTIONS[step.index];return `<section class="card question-card"><div class="question-meta"><span class="question-number">CÂU ${q.n} / 25</span><span class="points">4 ý · 4 điểm</span></div><h2 class="question-text" style="font-size:22px">${escapeHtml(q.stem)}</h2><div class="tf-list">${q.items.map(item=>{const value=attempt.answersTF[item.id];return `<div class="tf-item"><div class="tf-statement"><span class="tf-letter">${item.label.toUpperCase()}.</span>${escapeHtml(item.text)}</div><div class="tf-actions"><button class="tf-btn ${value===true?'selected':''}" data-action="chooseTF" data-item="${item.id}" data-value="true" aria-pressed="${value===true}">✓ Đúng</button><button class="tf-btn ${value===false?'selected':''}" data-action="chooseTF" data-item="${item.id}" data-value="false" aria-pressed="${value===false}">✕ Sai</button></div></div>`;}).join('')}</div><div class="keyword-preview">💡 Chọn Đúng hoặc Sai cho từng phát biểu. Mỗi phát biểu đúng được 1 điểm.</div></section>`;}
function renderEssay(step){const q=ESSAYS[step.index];const val=attempt.answersEssay[q.n]||'';return `<section class="card question-card"><div class="question-meta"><span class="question-number">CÂU ${q.n} / TỰ LUẬN</span><span class="points">Tối đa 10 điểm</span></div><h2 class="question-text" style="font-size:22px">${escapeHtml(q.prompt)}</h2><label class="input-label" for="essay-${q.n}">Câu trả lời của em</label><textarea class="essay-input" id="essay-${q.n}" data-essay="${q.n}" placeholder="Viết câu trả lời bằng lời của em…">${escapeHtml(val)}</textarea><div class="essay-info"><span>Hãy nêu các ý chính và giải thích ngắn gọn.</span><span id="wordCount">${wordCount(val)} từ</span></div><div class="keyword-preview">📝 Phần tự luận sẽ được chấm theo tiêu chí từ khóa. Em có thể diễn đạt theo cách riêng; không cần chép y nguyên đáp án mẫu.</div></section>`;}
function wordCount(v){const t=String(v||'').trim();return t?t.split(/\s+/).length:0;}
function renderQuiz(){const steps=makeSteps(),s=steps[attempt.currentStep];const content=s.type==='mc'?renderMC(s):s.type==='tf'?renderTF(s):renderEssay(s);const sectionIndex=s.type==='mc'?1:s.type==='tf'?2:3;const sectionName=s.section;return `<div class="toolbar"><div class="toolbar-left"><button class="back-btn" data-action="homeConfirm">← Thoát</button><span class="screen-title">Đang làm bài</span></div><div class="toolbar-right"><span class="user-tag">👤 ${escapeHtml(attempt.player)}</span><button class="sound-toggle" style="color:var(--ink);background:#fff;border-color:var(--line)" data-action="sound">${soundEnabled?'🔊 Âm thanh':'🔇 Âm thanh'}</button></div></div>
 <div class="quiz-layout"><div class="quiz-main"><div class="card quiz-topcard"><div class="quiz-toprow"><div><div class="section-label">${sectionName}</div><div class="step-count">Phần ${sectionIndex}/3 · Màn ${attempt.currentStep+1}/${steps.length}</div></div><div style="text-align:right"><div class="step-count">⏱ Thời gian</div><strong id="liveTimer" style="font-size:14px">${formatDuration(elapsed())}</strong></div></div><div class="progress-track"><div class="progress-fill" style="width:${(attempt.currentStep+1)/steps.length*100}%"></div></div></div>${content}<div class="quiz-footer"><div class="quiz-nav-buttons"><button class="nav-btn" data-action="prev" ${attempt.currentStep===0?'disabled':''}>← Câu trước</button><button class="nav-btn next" data-action="next" ${attempt.currentStep===steps.length-1?'disabled':''}>Câu tiếp →</button></div><button class="submit-btn" data-action="submit">Nộp bài & xem kết quả ✓</button></div><p class="privacy-note spaced">Chế độ kiểm tra: game không báo đúng/sai trong khi làm. Hãy nộp bài để xem đáp án và điểm.</p></div>${renderSidebar(steps)}</div>`;}
function evaluateEssay(q,answer){let score=0;const criteria=q.criteria.map(c=>{let hit=false;if(c.custom==='unitOrder')hit=unitOrderMatches(answer);else if(c.custom)hit=customCriterionMatches(answer,c.custom);else hit=groupMatches(answer,c.groups);const earned=hit?c.points:0;score+=earned;return {...c,hit,earned};});return {n:q.n,answer,score:Math.min(10,Math.round(score*100)/100),criteria,sample:q.sample,keywords:q.keywords,prompt:q.prompt};}
function calculateEvaluation(a){
 const mc= a.shuffledMC.map(q=>{const selectedId=a.answersMC[q.n]||null;const selected=q.options.find(o=>o.id===selectedId)||null;const correct=q.options.find(o=>o.correct);const isCorrect=!!selected&&selected.correct;return {n:q.n,text:q.text,options:q.options,selectedId,selectedText:selected?.text||'',correctId:correct.id,correctText:correct.text,isCorrect,answered:!!selected,score:isCorrect?2:0,why:q.why};});
 const tf=[];TF_QUESTIONS.forEach(q=>q.items.forEach(item=>{const selected=a.answersTF[item.id];const answered=typeof selected==='boolean';const isCorrect=answered&&selected===item.answer;tf.push({questionNo:q.n,stem:q.stem,...item,selected:answered?selected:null,answered,isCorrect,score:isCorrect?1:0});}));
 const essays=ESSAYS.map(q=>evaluateEssay(q,String(a.answersEssay[q.n]||'')));
 const mcScore=mc.reduce((s,x)=>s+x.score,0),tfScore=tf.reduce((s,x)=>s+x.score,0),essayScore=essays.reduce((s,x)=>s+x.score,0);
 const answeredMC=mc.filter(x=>x.answered).length,correctMC=mc.filter(x=>x.isCorrect).length,answeredTF=tf.filter(x=>x.answered).length,correctTF=tf.filter(x=>x.isCorrect).length,answeredEssay=essays.filter(x=>x.answer.trim()).length,allAnswered=answeredMC+answeredTF+answeredEssay;
 const total=Math.round((mcScore+tfScore+essayScore)*100)/100;
 return {mc,tf,essays,mcScore,tfScore,essayScore,total,answeredMC,correctMC,answeredTF,correctTF,answeredEssay,allAnswered,unanswered:44-allAnswered};
}
function submitAttempt(){const blanks=unansweredCount(attempt);if(blanks>0){const ok=confirm(`Còn ${blanks} mục chưa trả lời. Bạn vẫn muốn nộp bài và xem kết quả chứ?`);if(!ok)return;}const now=new Date();const evaluation=calculateEvaluation(attempt);const record={id:String(Date.now())+'_'+Math.random().toString(36).slice(2,7),player:attempt.player,startedAt:attempt.startedAt,completedAt:now.toISOString(),durationSeconds:elapsed(),attempt:{player:attempt.player,startedAt:attempt.startedAt,shuffledMC:attempt.shuffledMC,answersMC:attempt.answersMC,answersTF:attempt.answersTF,answersEssay:attempt.answersEssay},evaluation};const hist=getHistory();hist.unshift(record);saveHistory(hist);activeRecord=record;viewingHistory=false;screen='results';playSound('submit');render();scrollTo({top:0,behavior:'smooth'});}
function statusClass(isCorrect,answered){return !answered?'skipped':isCorrect?'correct':'wrong';}
function statusChip(isCorrect,answered){return `<span class="status-chip ${!answered?'neutral':isCorrect?'good':'bad'}">${!answered?'Chưa trả lời':isCorrect?'✓ Đúng':'✕ Sai'}</span>`;}
function renderMCReview(item){const cl=statusClass(item.isCorrect,item.answered);return `<article class="result-item ${cl}"><div class="result-head"><div class="result-question"><span class="muted">Câu ${item.n}.</span> ${escapeHtml(item.text)}</div>${statusChip(item.isCorrect,item.answered)}</div><div class="review-options">${item.options.map((o,i)=>{const letter=String.fromCharCode(65+i),correct=o.correct,chosen=o.id===item.selectedId;let classes='review-option';if(correct)classes+=' correct-answer';else if(chosen)classes+=' chosen-wrong';return `<div class="${classes}"><span class="mini-letter">${letter}.</span><span>${escapeHtml(o.text)}${chosen?' <strong>(em chọn)</strong>':''}${correct?' <strong>✓ Đáp án đúng</strong>':''}</span></div>`;}).join('')}</div><div class="explanation">💡 <strong>Giải thích:</strong> ${escapeHtml(item.why)}</div><div class="history-meta">Điểm: ${item.score}/2</div></article>`;}
function renderTFReview(item){const cl=statusClass(item.isCorrect,item.answered);return `<div class="tf-review-row ${cl}"><div class="symbol">${!item.answered?'—':item.isCorrect?'✓':'✕'}</div><div style="flex:1"><div><strong>${item.label.toUpperCase()}.</strong> ${escapeHtml(item.text)}</div><div class="history-meta">Em chọn: <strong>${item.answered?(item.selected?'Đúng':'Sai'):'Chưa trả lời'}</strong> · Đáp án: <strong>${item.answer?'Đúng':'Sai'}</strong> · ${item.score}/1 điểm</div><div class="history-meta" style="color:#475875">${escapeHtml(item.why)}</div></div></div>`;}
function normalizeWithMap(original){const chars=Array.from(String(original));let normalized='',map=[];chars.forEach((ch,i)=>{let n=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('vi').replace(/đ/g,'d');for(const c of Array.from(n)){if(/[a-z0-9]/.test(c)){normalized+=c;map.push(i);}else{normalized+=' ';map.push(i);}}});return {chars,normalized,map};}
function highlightAnswer(original,terms){const text=String(original||'');if(!text)return '';const {chars,normalized,map}=normalizeWithMap(text);const ranges=[];const cleanTerms=[...new Set((terms||[]).map(t=>normalizeText(t)).filter(t=>t.length>=2))].sort((a,b)=>b.length-a.length);for(const term of cleanTerms){let from=0;while(from<normalized.length){const pos=normalized.indexOf(term,from);if(pos<0)break;const before=pos===0?' ':normalized[pos-1],after=pos+term.length>=normalized.length?' ':normalized[pos+term.length];if((before===' '||/[.,;:!?()[\]{}"'“”‘’/\\\-]/.test(before))&&(after===' '||/[.,;:!?()[\]{}"'“”‘’/\\\-]/.test(after))){const st=map[pos],en=map[pos+term.length-1]+1;if(st!==undefined&&en>st)ranges.push([st,en]);}from=pos+Math.max(1,term.length);}}
 if(!ranges.length)return escapeHtml(text);ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);const merged=[];for(const r of ranges){const prev=merged[merged.length-1];if(prev&&r[0]<=prev[1])prev[1]=Math.max(prev[1],r[1]);else merged.push(r.slice());}let out='',cursor=0;for(const [st,en] of merged){out+=escapeHtml(chars.slice(cursor,st).join(''))+'<mark>'+escapeHtml(chars.slice(st,en).join(''))+'</mark>';cursor=en;}out+=escapeHtml(chars.slice(cursor).join(''));return out;}
function renderEssayReview(item){const cl=item.score>=9?'correct':item.score>=5?'skipped':'wrong';const terms=item.keywords||[];const misses=item.criteria.filter(c=>!c.hit);return `<article class="result-item ${cl}"><div class="result-head"><div class="result-question">Câu ${item.n}. ${escapeHtml(item.prompt)}</div><span class="status-chip ${item.score>=9?'good':item.score>=5?'neutral':'bad'}">${item.score}/10 điểm</span></div><div class="essay-answer ${item.answer.trim()?'':'empty'}">${item.answer.trim()?highlightAnswer(item.answer,terms):'Em chưa nhập câu trả lời.'}</div><div class="history-meta">Các cụm từ khóa được nhận diện trong bài của em được tô vàng. Điểm tự luận là điểm tham khảo theo tiêu chí, không phải đánh giá ngữ nghĩa bằng AI.</div><div class="rubric-list">${item.criteria.map(c=>`<div class="rubric-row ${c.hit?'hit':'miss'}"><span class="rubric-mark">${c.hit?'✓':'○'}</span><span class="rubric-text">${escapeHtml(c.label)}</span><span class="rubric-points">${c.earned}/${c.points} điểm</span></div>`).join('')}</div>${misses.length?`<div class="missing-note"><strong>Gợi ý ôn lại:</strong> ${misses.map(c=>escapeHtml(c.label)).join('; ')}.</div>`:`<div class="explanation">🌟 Em đã đáp ứng đầy đủ các tiêu chí từ khóa trong phần chấm này.</div>`}<details class="sample-answer"><summary>Xem câu trả lời tham khảo</summary><div class="sample-body">${escapeHtml(item.sample)}</div></details></article>`;}
function renderResults(record){const e=record.evaluation;const scoreText=Number.isInteger(e.total)?String(e.total):e.total.toFixed(1);const headline=e.total>=90?'Xuất sắc!':e.total>=80?'Làm rất tốt!':e.total>=65?'Em đang tiến bộ!':e.total>=50?'Cố gắng thêm một chút nhé!':'Mình cùng ôn lại từng phần nhé!';return `<div class="toolbar"><div class="toolbar-left"><button class="back-btn" data-action="${viewingHistory?'history':'home'}">← ${viewingHistory?'Lịch sử':'Trang chính'}</button><span class="screen-title">Kết quả bài làm</span></div><div class="toolbar-right"><span class="user-tag">👤 ${escapeHtml(record.player)}</span></div></div>
 <section class="card result-hero"><div><div class="result-kicker">${escapeHtml(headline)}</div><h1 style="font-size:clamp(28px,4vw,40px);margin:8px 0 12px">Bài làm đã hoàn thành</h1><p class="lead" style="margin-bottom:13px">${escapeHtml(record.player)}, dưới đây là kết quả và phần chữa bài để em biết mình đã vững phần nào, cần ôn lại phần nào.</p><div class="pill-row" style="margin-bottom:0"><span class="pill">🧩 Trắc nghiệm đúng: ${e.correctMC+e.correctTF}/40 ý</span><span class="pill">📅 ${formatDate(record.completedAt)}</span><span class="pill">⏱️ ${formatDuration(record.durationSeconds)}</span></div></div><div class="score-circle"><div class="result-score">${scoreText}<small>/100</small></div></div></section>
 <div class="summary-grid"><div class="card summary-stat"><div class="big">${e.answeredMC}/20</div><div class="label">Câu A–D đã làm</div><div class="history-meta">Đúng ${e.correctMC}/20 · ${e.mcScore}/40 điểm</div></div><div class="card summary-stat"><div class="big">${e.answeredTF}/20</div><div class="label">Ý đúng/sai đã làm</div><div class="history-meta">Đúng ${e.correctTF}/20 · ${e.tfScore}/20 điểm</div></div><div class="card summary-stat"><div class="big">${e.answeredEssay}/4</div><div class="label">Câu tự luận có nội dung</div><div class="history-meta">${Number(e.essayScore.toFixed(1))}/40 điểm</div></div><div class="card summary-stat"><div class="big">${e.allAnswered}/44</div><div class="label">Tổng mục đã trả lời</div><div class="history-meta">Còn ${e.unanswered} mục bỏ trống</div></div></div>
 <div class="toolbar spaced"><div><div class="screen-title">Chữa bài chi tiết</div><div class="muted" style="font-size:13px">Xanh lá: đáp án đúng · Đỏ: câu làm sai · Tự luận: từ khóa nhận diện và ý còn thiếu.</div></div><div class="toolbar-right"><button class="secondary-btn" data-action="newAttempt">Làm bài mới ↻</button></div></div>
 <section class="card section-card"><div class="section-heading"><h2>Phần I · Trắc nghiệm A–D</h2><span class="badge">${e.mcScore}/40 điểm</span></div>${e.mc.map(renderMCReview).join('')}</section>
 <section class="card section-card"><div class="section-heading"><h2>Phần II · Trắc nghiệm đúng/sai</h2><span class="badge">${e.tfScore}/20 điểm</span></div>${TF_QUESTIONS.map(q=>{const items=e.tf.filter(item=>item.questionNo===q.n);return `<div class="result-item"><div class="result-question">Câu ${q.n}. ${escapeHtml(q.stem)}</div><div class="tf-review-list">${items.map(renderTFReview).join('')}</div></div>`;}).join('')}</section>
 <section class="card section-card"><div class="section-heading"><h2>Phần III · Tự luận</h2><span class="badge">${Number(e.essayScore.toFixed(1))}/40 điểm</span></div><p class="muted" style="font-size:13px">Điểm được tính theo các tiêu chí từ khóa đã thiết lập. Cách diễn đạt tương đương có thể chưa được nhận diện đầy đủ; hãy dùng gợi ý để tự rà soát bài.</p>${e.essays.map(renderEssayReview).join('')}</section>
 <div class="btn-row spaced"><button class="primary-btn" data-action="newAttempt">Làm bài mới</button><button class="secondary-btn" data-action="history">Xem lịch sử ôn tập</button></div>`;}
function renderHistory(){const hist=getHistory();return `<div class="toolbar"><div class="toolbar-left"><button class="back-btn" data-action="home">← Trang chính</button><span class="screen-title">Lịch sử ôn tập</span></div><div class="toolbar-right">${hist.length?`<button class="small-btn delete" data-action="clearHistory">Xóa lịch sử</button>`:''}</div></div><section class="card section-card"><div class="section-heading"><div><h2>Các lần làm bài</h2><div class="muted" style="font-size:13px">Lưu tối đa ${MAX_HISTORY} lần gần nhất trên trình duyệt này.</div></div><span class="badge">${hist.length} lần</span></div>${hist.length?`<div class="history-list">${hist.map(r=>`<div class="history-row"><div><div class="history-name">${escapeHtml(r.player)}</div><div class="history-meta">${formatDate(r.completedAt)}<br>Thời gian: ${formatDuration(r.durationSeconds)} · Đã trả lời ${r.evaluation.allAnswered}/44 mục</div></div><div class="history-actions"><div class="history-score">${Number.isInteger(r.evaluation.total)?r.evaluation.total:r.evaluation.total.toFixed(1)}<span style="font-size:12px;color:var(--muted);font-weight:700">/100</span></div><button class="small-btn" data-action="viewHistory" data-id="${escapeHtml(r.id)}">Xem lại</button></div></div>`).join('')}</div>`:`<div class="history-empty"><div style="font-size:38px">📚</div><h3>Chưa có lịch sử ôn tập</h3><p>Hoàn thành bài đầu tiên để theo dõi điểm số và thời gian của mình.</p><button class="primary-btn" data-action="newAttempt">Bắt đầu làm bài</button></div>`}</section><p class="privacy-note spaced">Lịch sử không tự đồng bộ sang thiết bị khác. Không nên xóa dữ liệu trang web của trình duyệt nếu muốn giữ các kết quả cũ.</p>`;}
function render(){if(timerHandle)clearInterval(timerHandle);if(screen==='home')app.innerHTML=renderHome();else if(screen==='quiz'){app.innerHTML=renderQuiz();timerHandle=setInterval(updateTimer,1000);}else if(screen==='results'){app.innerHTML=activeRecord?renderResults(activeRecord):renderHome();}else if(screen==='history')app.innerHTML=renderHistory();}
function moveToStep(index){const steps=makeSteps();if(index<0||index>=steps.length)return;const savedScrollY=window.scrollY;attempt.currentStep=index;render();playSound('navigate');document.documentElement.style.scrollBehavior='auto';window.scrollTo(0,savedScrollY);requestAnimationFrame(()=>{document.documentElement.style.scrollBehavior='';});}
function askExit(){if(answerCount(attempt)>0){if(!confirm('Bạn đang làm bài. Thoát về trang chính sẽ kết thúc lượt làm hiện tại và không lưu vào lịch sử. Bạn có chắc không?'))return;}screen='home';attempt=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function beginNewFromResults(){const name=activeRecord?.player||attempt?.player||'';attempt=null;activeRecord=null;screen='home';render();const field=document.getElementById('playerName');if(field)field.value=name;window.scrollTo({top:0,behavior:'smooth'});}
app.addEventListener('submit',event=>{if(event.target.id==='startForm'){event.preventDefault();const name=String(new FormData(event.target).get('playerName')||'').trim();if(!name){showToast('Em hãy nhập tên trước khi bắt đầu.');return;}startAttempt(name);}});
app.addEventListener('input',event=>{const qn=event.target?.dataset?.essay;if(qn&&attempt){attempt.answersEssay[qn]=event.target.value;const wc=document.getElementById('wordCount');if(wc)wc.textContent=wordCount(event.target.value)+' từ';const counter=document.querySelector('.side-progress strong');if(counter)counter.textContent=answerCount(attempt)+'/44 ý';const progress=document.querySelector('.mini-progress span');if(progress)progress.style.width=(answerCount(attempt)/44*100)+'%';document.querySelectorAll('.jump-btn').forEach(btn=>{const step=makeSteps()[Number(btn.dataset.step)];if(step&&isStepAnswered(step))btn.classList.add('answered');else if(btn)btn.classList.remove('answered');});}});
app.addEventListener('click',event=>{
 const btn=event.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
 if(action==='sound'){toggleSound();return;}
 if(action==='history'){screen='history';viewingHistory=false;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='home'){screen='home';viewingHistory=false;activeRecord=null;attempt=null;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='homeConfirm'){askExit();return;}
 if(action==='chooseMC'){const s=currentStepData();if(!attempt||s.type!=='mc')return;attempt.answersMC[MC_QUESTIONS[s.index].n]=btn.dataset.option;playSound('tap');render();return;}
 if(action==='chooseTF'){const value=btn.dataset.value==='true';attempt.answersTF[btn.dataset.item]=value;playSound('tap');render();return;}
 if(action==='prev'){moveToStep(attempt.currentStep-1);return;}
 if(action==='next'){moveToStep(attempt.currentStep+1);return;}
 if(action==='jump'){moveToStep(Number(btn.dataset.step));return;}
 if(action==='submit'){submitAttempt();return;}
 if(action==='newAttempt'){beginNewFromResults();return;}
 if(action==='viewHistory'){const record=getHistory().find(r=>r.id===btn.dataset.id);if(!record){showToast('Không tìm thấy lượt làm bài này.');return;}activeRecord=record;screen='results';viewingHistory=true;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='clearHistory'){if(confirm('Bạn có chắc muốn xóa toàn bộ lịch sử ôn tập trên trình duyệt này?')){saveHistory([]);render();showToast('Đã xóa lịch sử ôn tập.');}return;}
});
render();
</script>
